services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 8080
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:8080:8080" # Safely exposes API only to your local browser
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - secure_backend
      - frontend_ingress
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8080
      VITE_WS_URL: ws://127.0.0.1:8080
    ports:
      - "127.0.0.1:5173:5173" # Safely exposes UI only to your local machine
    depends_on:
      - backend
    networks:
      - frontend_ingress
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Performance tweaks optimized for volatile rate-limit caching (persistence turned off)
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - secure_backend
    restart: unless-stopped

networks:
  # The web-facing network for frontend/backend container communication.
  frontend_ingress:
    driver: bridge

  # Isolated data tier for backend/Redis communication.
  secure_backend:
    driver: bridge
    internal: true
